[net/launchpad/plank/docks/dock1]
dock-items=['chrome.dockitem', 'thunar.dockitem', 'xfce4-terminal.dockitem']
hide-mode='none'
icon-size=48
position='bottom'
theme='Transparent'

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sidebar-width=156
sort-column='name'
sort-directories-first=false
sort-order='ascending'
type-format='category'
window-position=(90, 29)
window-size=(1100, 680)
